<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Mathventures</title>
    <meta name="description" content="A premium red and black themed crossword puzzle.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    <main class="container">
        <header>
            <h1>Crossword <span class="highlight">Mathventures</span></h1>
            <p>Solve the puzzle below</p>
        </header>

        <div class="content-wrapper">
            <section class="crossword-section">
                <div id="crossword-grid" class="crossword-grid">
                    <!-- Grid generated by JS -->
                </div>
            </section>

            <aside class="clues-section">
                <div class="clues-container glass-panel">
                    <div class="clue-column">
                        <h2>Across</h2>
                        <ul id="across-clues" class="clue-list">
                            <!-- Across clues generated by JS -->
                        </ul>
                    </div>
                    <div class="clue-column">
                        <h2>Down</h2>
                        <ul id="down-clues" class="clue-list">
                            <!-- Down clues generated by JS -->
                        </ul>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
